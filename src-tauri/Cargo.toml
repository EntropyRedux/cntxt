[package]
name = "cntxt"
version = "0.7.0"
description = "CNTXT - Modular Frontend UI Development Platform"
authors = ["CNTXT Development Team"]
edition = "2021"

[lib]
name = "cntxt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cntxt"
path = "src/main.rs"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
open = "5.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"
keyring = "3.6.3"
arboard = "3"
tauri-plugin-single-instance = "2"
portable-pty = "0.8"

[profile.dev]
incremental = false
codegen-units = 1

[profile.dev.build-override]
incremental = false
codegen-units = 1

[profile.release]
codegen-units = 1
lto = "thin"
incremental = false
opt-level = 3
strip = true
